<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250">
<rect width="420" height="250" rx="14" fill="#f8fafc"/>
<text x="210" y="36" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="'Be Vietnam Pro',Arial,sans-serif">Tỉ lệ bản đồ có 2 dạng</text>
<rect x="30" y="56" width="360" height="70" rx="10" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
<text x="48" y="86" font-size="17" font-weight="700" fill="#1e40af" font-family="'Be Vietnam Pro',Arial,sans-serif">1. Tỉ lệ số:</text>
<text x="215" y="88" font-size="24" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="'Be Vietnam Pro',Arial,sans-serif">1 : 100 000</text>
<text x="48" y="114" font-size="14.5" fill="#334155" font-family="'Be Vietnam Pro',Arial,sans-serif">1 cm trên bản đồ = 100 000 cm = 1 km ngoài thực tế</text>
<rect x="30" y="140" width="360" height="86" rx="10" fill="#fef9c3" stroke="#fde047" stroke-width="2"/>
<text x="48" y="168" font-size="17" font-weight="700" fill="#854d0e" font-family="'Be Vietnam Pro',Arial,sans-serif">2. Tỉ lệ thước:</text>
<g font-family="'Be Vietnam Pro',Arial,sans-serif" font-size="13.5" fill="#1f2937" text-anchor="middle">
<rect x="110" y="182" width="65" height="16" fill="#1f2937"/>
<rect x="175" y="182" width="65" height="16" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<rect x="240" y="182" width="65" height="16" fill="#1f2937"/>
<rect x="305" y="182" width="65" height="16" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
<text x="110" y="176">0</text><text x="175" y="176">1</text><text x="240" y="176">2</text><text x="305" y="176">3</text><text x="372" y="176">4 km</text>
</g>
</svg>
