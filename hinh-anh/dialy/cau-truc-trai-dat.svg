<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ cấu trúc bên trong Trái Đất">
  <rect width="640" height="360" fill="#ffffff"/>
  <circle cx="180" cy="180" r="140" fill="#f8bbd0" stroke="#37474f" stroke-width="2"/>
  <path d="M180,180 L180,40 A140,140 0 0 1 320,180 Z" fill="#a1887f"/>
  <path d="M180,180 L180,58 A122,122 0 0 1 302,180 Z" fill="#ff7043"/>
  <path d="M180,180 L180,96 A84,84 0 0 1 264,180 Z" fill="#ffca28"/>
  <path d="M180,180 L180,140 A40,40 0 0 1 220,180 Z" fill="#fff59d"/>
  <line x1="180" y1="180" x2="180" y2="40" stroke="#37474f" stroke-width="2"/>
  <line x1="180" y1="180" x2="320" y2="180" stroke="#37474f" stroke-width="2"/>
  <circle cx="180" cy="180" r="140" fill="none" stroke="#37474f" stroke-width="2"/>
  <g font-family="sans-serif" font-size="17" fill="#212121">
    <line x1="292" y1="66" x2="352" y2="52" stroke="#37474f" stroke-width="1.4"/>
    <circle cx="292" cy="66" r="3" fill="#37474f"/>
    <text x="358" y="58" font-weight="bold">Vỏ Trái Đất</text>
    <text x="358" y="80" font-size="15" fill="#455a64">lớp ngoài cùng, dày 5–70 km</text>
    <line x1="272" y1="106" x2="352" y2="128" stroke="#37474f" stroke-width="1.4"/>
    <circle cx="272" cy="106" r="3" fill="#37474f"/>
    <text x="358" y="134" font-weight="bold">Lớp phủ (manti)</text>
    <text x="358" y="156" font-size="15" fill="#455a64">lớp dày nhất, sâu tới 2.900 km</text>
    <line x1="238" y1="140" x2="352" y2="204" stroke="#37474f" stroke-width="1.4"/>
    <circle cx="238" cy="140" r="3" fill="#37474f"/>
    <text x="358" y="210" font-weight="bold">Lõi ngoài</text>
    <text x="358" y="232" font-size="15" fill="#455a64">kim loại nóng chảy (lỏng), tới 5.100 km</text>
    <line x1="206" y1="168" x2="352" y2="282" stroke="#37474f" stroke-width="1.4"/>
    <circle cx="206" cy="168" r="3" fill="#37474f"/>
    <text x="358" y="288" font-weight="bold">Lõi trong</text>
    <text x="358" y="310" font-size="15" fill="#455a64">kim loại rắn, ở tâm Trái Đất (6.371 km)</text>
  </g>
  <text x="320" y="345" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#607d8b">Cấu trúc bên trong Trái Đất — sơ đồ minh họa, độ dày các lớp không theo tỉ lệ thật.</text>
</svg>
