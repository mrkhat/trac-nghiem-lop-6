<text x="545" y="282" font-size="22" font-weight="700" fill="#dc2626" font-family="'Be Vietnam Pro',Arial,sans-serif">Áp thấp xích đạo (0°)</text>
<text x="545" y="308" font-size="19" fill="#1f2937" font-family="'Be Vietnam Pro',Arial,sans-serif">không khí nóng bốc lên cao → hay mưa</text>
<text x="545" y="392" font-size="21" font-weight="700" fill="#ea580c" font-family="'Be Vietnam Pro',Arial,sans-serif">➜ Gió Tín phong: thổi về Xích đạo</text>
<text x="545" y="428" font-size="21" font-weight="700" fill="#0d9488" font-family="'Be Vietnam Pro',Arial,sans-serif">➜ Gió Tây ôn đới: thổi về phía cực</text>
<text x="545" y="464" font-size="21" font-weight="700" fill="#7c3aed" font-family="'Be Vietnam Pro',Arial,sans-serif">➜ Gió Đông cực: thổi từ cực xuống ôn đới</text>
<text x="545" y="512" font-size="18" fill="#475569" font-family="'Be Vietnam Pro',Arial,sans-serif">Gió luôn thổi từ nơi áp cao đến nơi áp thấp. (Sơ đồ đơn giản hoá, nhìn một phía của Trái Đất.)</text>
