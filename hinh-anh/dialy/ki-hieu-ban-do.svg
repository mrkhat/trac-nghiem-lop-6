<text x="150" y="216" font-size="16.5" font-weight="700" fill="#14532d">Kí hiệu diện (mảng màu)</text>
<text x="150" y="239" font-size="14" fill="#334155">rừng (mảng xanh lá) — biển, hồ (mảng xanh dương)…</text>
