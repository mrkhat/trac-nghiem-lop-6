<text x="150" y="169" font-size="14" fill="#334155">sông (đường xanh uốn lượn) — đường giao thông…</text>
<rect x="24" y="192" width="372" height="60" rx="9" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
