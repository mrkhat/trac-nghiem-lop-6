<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ kinh tuyến và vĩ tuyến trên quả Địa Cầu">
  <rect width="640" height="380" fill="#ffffff"/>
  <circle cx="215" cy="185" r="135" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <g fill="none" stroke="#42a5f5" stroke-width="1.6">
    <ellipse cx="215" cy="110" rx="103" ry="20"/>
    <ellipse cx="215" cy="148" rx="126" ry="24"/>
    <ellipse cx="215" cy="222" rx="126" ry="24"/>
    <ellipse cx="215" cy="260" rx="103" ry="20"/>
  </g>
  <ellipse cx="215" cy="185" rx="135" ry="26" fill="none" stroke="#c62828" stroke-width="2.6"/>
  <g fill="none" stroke="#42a5f5" stroke-width="1.6">
    <ellipse cx="215" cy="185" rx="48" ry="135"/>
    <ellipse cx="215" cy="185" rx="95" ry="135"/>
  </g>
  <path d="M215,50 A135,135 0 0 1 215,320" fill="none" stroke="#2e7d32" stroke-width="2.6"/>
  <line x1="215" y1="50" x2="215" y2="320" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="5 4"/>
  <circle cx="215" cy="50" r="4.5" fill="#c62828"/>
  <circle cx="215" cy="320" r="4.5" fill="#c62828"/>
  <g font-family="sans-serif" font-size="17" fill="#212121">
    <text x="228" y="46" font-weight="bold" fill="#c62828">Cực Bắc</text>
    <text x="228" y="330" font-weight="bold" fill="#c62828">Cực Nam</text>
    <line x1="330" y1="176" x2="392" y2="86" stroke="#37474f" stroke-width="1.4"/>
    <text x="398" y="80" font-weight="bold" fill="#2e7d32">Kinh tuyến</text>
    <text x="398" y="102" font-size="15" fill="#455a64">đường nối Cực Bắc – Cực Nam;</text>
    <text x="398" y="122" font-size="15" fill="#455a64">đường xanh lá đậm là kinh tuyến gốc 0°</text>
    <line x1="92" y1="140" x2="36" y2="120" stroke="#37474f" stroke-width="1.4"/>
    <text x="30" y="106" font-weight="bold" fill="#1565c0">Vĩ tuyến</text>
    <text x="30" y="86" font-size="15" fill="#455a64">các vòng tròn song song</text>
    <text x="30" y="66" font-size="15" fill="#455a64">với Xích đạo</text>
    <line x1="300" y1="205" x2="392" y2="238" stroke="#c62828" stroke-width="1.4"/>
    <text x="398" y="244" font-weight="bold" fill="#c62828">Xích đạo</text>
    <text x="398" y="266" font-size="15" fill="#455a64">vĩ tuyến 0°, vĩ tuyến lớn nhất,</text>
    <text x="398" y="286" font-size="15" fill="#455a64">chia Trái Đất thành bán cầu Bắc và Nam</text>
  </g>
  <text x="320" y="368" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#607d8b">Hệ thống kinh tuyến – vĩ tuyến trên quả Địa Cầu (sơ đồ minh họa đơn giản hoá).</text>
</svg>
