<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" font-family="Be Vietnam Pro, Arial, sans-serif">
<rect width="840" height="520" fill="#f7f9fc"/>
<!-- mai nha -->
<polygon points="430,55 602,205 258,205" fill="#e57373" stroke="#b71c1c" stroke-width="3"/>
<!-- khung nha (cot + dam, phia trai) -->
<rect x="280" y="193" width="132" height="13" fill="#1565c0"/>
<rect x="292" y="205" width="13" height="145" fill="#1565c0"/>
<rect x="392" y="205" width="13" height="145" fill="#1565c0"/>
<!-- tuong nha (phia phai) -->
<rect x="412" y="205" width="156" height="145" fill="#fff59d" stroke="#f9a825" stroke-width="3"/>
<!-- cua so -->
<rect x="522" y="234" width="36" height="40" fill="#b3e5fc" stroke="#0277bd" stroke-width="2"/>
<line x1="540" y1="234" x2="540" y2="274" stroke="#0277bd" stroke-width="2"/>
<line x1="522" y1="254" x2="558" y2="254" stroke="#0277bd" stroke-width="2"/>
<!-- cua ra vao -->
<rect x="466" y="270" width="48" height="80" fill="#66bb6a" stroke="#2e7d32" stroke-width="3"/>
<circle cx="505" cy="312" r="4" fill="#2e7d32"/>
<!-- san nha -->
<rect x="262" y="350" width="336" height="18" fill="#ffcc80" stroke="#e65100" stroke-width="3"/>
<!-- mong nha -->
<rect x="282" y="368" width="296" height="34" fill="#b0bec5" stroke="#37474f" stroke-width="3"/>
<circle cx="330" cy="385" r="9" fill="#90a4ae"/><circle cx="395" cy="385" r="9" fill="#90a4ae"/><circle cx="460" cy="385" r="9" fill="#90a4ae"/><circle cx="525" cy="385" r="9" fill="#90a4ae"/>
<!-- mat dat -->
<line x1="60" y1="402" x2="780" y2="402" stroke="#795548" stroke-width="5"/>
<!-- nhan trai -->
<g font-size="20" font-weight="bold">
<line x1="305" y1="118" x2="208" y2="118" stroke="#b71c1c" stroke-width="2"/><text x="200" y="126" text-anchor="end" fill="#b71c1c">Mái nhà</text>
<line x1="292" y1="258" x2="208" y2="258" stroke="#1565c0" stroke-width="2"/><text x="200" y="266" text-anchor="end" fill="#1565c0">Khung nhà</text>
<line x1="262" y1="359" x2="208" y2="359" stroke="#e65100" stroke-width="2"/><text x="200" y="367" text-anchor="end" fill="#e65100">Sàn nhà</text>
<line x1="282" y1="386" x2="208" y2="386" stroke="#37474f" stroke-width="2"/><text x="200" y="394" text-anchor="end" fill="#37474f">Móng nhà</text>
</g>
<!-- nhan phai -->
<g font-size="20" font-weight="bold">
<line x1="568" y1="220" x2="632" y2="220" stroke="#f9a825" stroke-width="2"/><text x="640" y="228" fill="#e65100">Tường nhà</text>
<line x1="558" y1="254" x2="632" y2="254" stroke="#0277bd" stroke-width="2"/><text x="640" y="262" fill="#0277bd">Cửa sổ</text>
<line x1="514" y1="314" x2="632" y2="314" stroke="#2e7d32" stroke-width="2"/><text x="640" y="322" fill="#2e7d32">Cửa ra vào</text>
</g>
<text x="420" y="452" text-anchor="middle" font-size="19" font-weight="bold" fill="#37474f">Nhà ở gồm 7 phần chính:</text>
<text x="420" y="480" text-anchor="middle" font-size="18" fill="#37474f">móng nhà, sàn nhà, khung nhà, tường nhà, mái nhà, cửa ra vào, cửa sổ.</text>
</svg>
