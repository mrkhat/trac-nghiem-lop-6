<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="Be Vietnam Pro, Arial, sans-serif">
<rect width="840" height="470" fill="#f7f9fc"/>
<!-- mái -->
<polygon points="380,40 620,190 140,190" fill="#e57373" stroke="#b71c1c" stroke-width="3"/>
<rect x="330" y="86" width="100" height="40" fill="#ef9a9a" stroke="#b71c1c" stroke-width="2"/>
<!-- thân -->
<rect x="190" y="190" width="380" height="160" fill="#ffe0b2" stroke="#e65100" stroke-width="3"/>
<rect x="255" y="245" width="70" height="105" fill="#8d6e63"/>
<rect x="435" y="245" width="70" height="70" fill="#b3e5fc" stroke="#0277bd" stroke-width="2"/>
<!-- móng -->
<rect x="160" y="350" width="440" height="46" fill="#90a4ae" stroke="#37474f" stroke-width="3"/>
<line x1="60" y1="396" x2="700" y2="396" stroke="#795548" stroke-width="5"/>
<!-- nhãn phải -->
<g font-size="21" font-weight="bold">
<line x1="520" y1="120" x2="640" y2="120" stroke="#b71c1c" stroke-width="2"/><text x="648" y="128" fill="#b71c1c">1. MÁI NHÀ</text>
<line x1="570" y1="265" x2="640" y2="265" stroke="#e65100" stroke-width="2"/><text x="648" y="273" fill="#e65100">2. THÂN NHÀ</text>
<line x1="600" y1="373" x2="640" y2="373" stroke="#37474f" stroke-width="2"/><text x="648" y="381" fill="#37474f">3. MÓNG NHÀ</text>
</g>
<text x="380" y="445" text-anchor="middle" font-size="19" fill="#37474f">Nhà ở gồm 3 phần chính: móng ở dưới cùng, thân nhà ở giữa, mái che ở trên.</text>
</svg>