<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="760" height="522" fill="#fffdf5"/><text x="380" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#37474f">BẢO QUẢN THỰC PHẨM BẰNG TỦ LẠNH</text><rect x="90" y="70" width="580" height="62" rx="14" fill="#2e7d32"/><circle cx="130" cy="101" r="21" fill="#fff"/><text x="130" y="109" text-anchor="middle" font-size="23" font-weight="bold" fill="#2e7d32">1</text><text x="168" y="98" font-size="20" font-weight="bold" fill="#fff">Chọn thực phẩm tươi</text><text x="168" y="121" font-size="16.5" fill="#fff">không dập nát, không có mùi lạ</text><polygon points="372,136 388,136 380,154" fill="#37474f"/><rect x="90" y="156" width="580" height="62" rx="14" fill="#2e7d32"/><circle cx="130" cy="187" r="21" fill="#fff"/><text x="130" y="195" text-anchor="middle" font-size="23" font-weight="bold" fill="#2e7d32">2</text><text x="168" y="184" font-size="20" font-weight="bold" fill="#fff">Rửa sạch, để ráo nước</text><text x="168" y="207" font-size="16.5" fill="#fff">rau rửa sạch; thịt để nguyên, rửa khi nấu</text><polygon points="372,222 388,222 380,240" fill="#37474f"/><rect x="90" y="242" width="580" height="62" rx="14" fill="#2e7d32"/><circle cx="130" cy="273" r="21" fill="#fff"/><text x="130" y="281" text-anchor="middle" font-size="23" font-weight="bold" fill="#2e7d32">3</text><text x="168" y="270" font-size="20" font-weight="bold" fill="#fff">Cho vào hộp hoặc túi kín</text><text x="168" y="293" font-size="16.5" fill="#fff">mỗi loại một hộp riêng, đậy nắp</text><polygon points="372,308 388,308 380,326" fill="#37474f"/><rect x="90" y="328" width="580" height="62" rx="14" fill="#2e7d32"/><circle cx="130" cy="359" r="21" fill="#fff"/><text x="130" y="367" text-anchor="middle" font-size="23" font-weight="bold" fill="#2e7d32">4</text><text x="168" y="356" font-size="20" font-weight="bold" fill="#fff">Để đúng ngăn</text><text x="168" y="379" font-size="16.5" fill="#fff">thịt cá: ngăn đá; rau quả: ngăn mát</text><polygon points="372,394 388,394 380,412" fill="#37474f"/><rect x="90" y="414" width="580" height="62" rx="14" fill="#2e7d32"/><circle cx="130" cy="445" r="21" fill="#fff"/><text x="130" y="453" text-anchor="middle" font-size="23" font-weight="bold" fill="#2e7d32">5</text><text x="168" y="442" font-size="20" font-weight="bold" fill="#fff">Dùng sớm, không để quá lâu</text><text x="168" y="465" font-size="16.5" fill="#fff">đồ để lâu vẫn có thể bị hỏng</text></svg>