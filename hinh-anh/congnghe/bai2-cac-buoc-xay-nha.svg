<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 522" font-family="Be Vietnam Pro, Arial, sans-serif"><rect width="760" height="522" fill="#fffdf5"/><text x="380" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#37474f">CÁC BƯỚC XÂY MỘT NGÔI NHÀ</text><rect x="90" y="70" width="580" height="62" rx="14" fill="#0277bd"/><circle cx="130" cy="101" r="21" fill="#fff"/><text x="130" y="109" text-anchor="middle" font-size="23" font-weight="bold" fill="#0277bd">1</text><text x="168" y="98" font-size="20" font-weight="bold" fill="#fff">Thiết kế và chuẩn bị</text><text x="168" y="121" font-size="16.5" fill="#fff">vẽ bản vẽ, chuẩn bị đất, vật liệu, tiền</text><polygon points="372,136 388,136 380,154" fill="#37474f"/><rect x="90" y="156" width="580" height="62" rx="14" fill="#0277bd"/><circle cx="130" cy="187" r="21" fill="#fff"/><text x="130" y="195" text-anchor="middle" font-size="23" font-weight="bold" fill="#0277bd">2</text><text x="168" y="184" font-size="20" font-weight="bold" fill="#fff">Làm móng nhà</text><text x="168" y="207" font-size="16.5" fill="#fff">việc đầu tiên của thi công thô</text><polygon points="372,222 388,222 380,240" fill="#37474f"/><rect x="90" y="242" width="580" height="62" rx="14" fill="#0277bd"/><circle cx="130" cy="273" r="21" fill="#fff"/><text x="130" y="281" text-anchor="middle" font-size="23" font-weight="bold" fill="#0277bd">3</text><text x="168" y="270" font-size="20" font-weight="bold" fill="#fff">Xây phần thô</text><text x="168" y="293" font-size="16.5" fill="#fff">khung tường, tường, nền, mái, cửa, ống nước, điện</text><polygon points="372,308 388,308 380,326" fill="#37474f"/><rect x="90" y="328" width="580" height="62" rx="14" fill="#0277bd"/><circle cx="130" cy="359" r="21" fill="#fff"/><text x="130" y="367" text-anchor="middle" font-size="23" font-weight="bold" fill="#0277bd">4</text><text x="168" y="356" font-size="20" font-weight="bold" fill="#fff">Hoàn thiện</text><text x="168" y="379" font-size="16.5" fill="#fff">trát, sơn, lát nền, lắp cửa</text><polygon points="372,394 388,394 380,412" fill="#37474f"/><rect x="90" y="414" width="580" height="62" rx="14" fill="#0277bd"/><circle cx="130" cy="445" r="21" fill="#fff"/><text x="130" y="453" text-anchor="middle" font-size="23" font-weight="bold" fill="#0277bd">5</text><text x="168" y="442" font-size="20" font-weight="bold" fill="#fff">Nghiệm thu và vào ở</text><text x="168" y="465" font-size="16.5" fill="#fff">kiểm tra kĩ rồi mới dọn vào ở</text></svg>