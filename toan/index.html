<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toán 6 - Tự luận Học kì 1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;max-width:800px;margin:0 auto;padding:16px;background:#f5f5f5;color:#222}
h1{text-align:center;color:#2e7d32;margin-bottom:6px}
.sub{text-align:center;color:#666;margin-bottom:6px}
.steps{text-align:center;color:#2e7d32;font-size:14px;margin-bottom:20px}
a.back{display:inline-block;color:#2e7d32;text-decoration:none;margin-bottom:12px}
.chap{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chap h2{font-size:18px;color:#2e7d32;margin-bottom:10px}
.p-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px;border:1px solid #ddd;border-radius:8px;background:#fafafa;cursor:pointer;font-size:15px;margin:6px 0}
.p-item:hover{background:#e8f5e9}
.p-item .done{color:#2e7d32;font-weight:bold}
.p-item .todo{color:#bbb}
.tag{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:10px;padding:2px 10px;font-size:12px;margin-bottom:10px}
.card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:14px}
.card h2{font-size:18px;margin-bottom:10px}
.ptext{white-space:pre-line;font-size:16px;line-height:1.55;margin-bottom:10px}
.fig{text-align:center;margin:10px 0}
.btn{padding:10px 18px;font-size:15px;border:none;border-radius:8px;cursor:pointer;color:#fff;margin:4px 4px 4px 0}
.btn-a{background:#1a73e8}.btn-h{background:#ea8600}.btn-s{background:#6a1b9a}.btn-c{background:#2e7d32}.btn-g{background:#666}
.panel{border-radius:8px;padding:12px 14px;margin:10px 0;display:none;font-size:15px;line-height:1.55}
.panel.show{display:block}
.panel-a{background:#e3f2fd;border:1px solid #90caf9}
.panel-h{background:#fff3cd;border:1px solid #ffe082}
.panel-s{background:#f3e5f5;border:1px solid #ce93d8}
.panel h3{font-size:15px;margin-bottom:6px}
.panel .lbl{font-weight:bold;color:#1565c0}
.panel ol{margin-left:20px}
.panel li{margin:4px 0}
.ans-row{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.ans-row label{font-size:15px;min-width:170px}
.ans-row input{padding:10px;font-size:16px;border:2px solid #bbb;border-radius:8px;width:150px}
.ans-row input.ok{border-color:#2e7d32;background:#e8f5e9}
.ans-row input.no{border-color:#dc3545;background:#fdecea}
.ans-row .unit{color:#555}
.fb{font-size:15px;margin:8px 0;min-height:20px}
.fb.ok{color:#2e7d32;font-weight:bold}.fb.no{color:#dc3545}
.nav{display:flex;justify-content:space-between;margin-top:6px}
.hidden{display:none}
#progress{text-align:center;color:#555;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<a class="back" href="../">← Trang chủ các môn</a>
<h1>🔢 Toán 6 — Tự luận</h1>
<p class="sub">Học kì 1 • <span id="totalCount"></span> bài toán có lời văn &amp; hình học</p>
<p class="steps">Đọc đề → 🔍 Phân tích → ✍️ Tự giải → ✔ Kiểm tra → 📖 Đối chiếu lời giải</p>

<div id="home"></div>

<div id="probArea" class="hidden">
  <button class="btn btn-g" id="btnList">← Danh sách bài</button>
  <div class="card">
    <span class="tag" id="pTopic"></span>
    <h2 id="pTitle"></h2>
    <div class="ptext" id="pText"></div>
    <div class="fig" id="pFig"></div>
    <div>
      <button class="btn btn-a" id="btnAna">🔍 Phân tích đề</button>
      <button class="btn btn-h" id="btnHint">💡 Gợi ý</button>
      <button class="btn btn-s" id="btnSol">📖 Lời giải</button>
    </div>
    <div class="panel panel-a" id="anaPanel"></div>
    <div class="panel panel-h" id="hintPanel"></div>
    <div class="panel panel-s" id="solPanel"></div>
    <div id="ansArea"></div>
    <button class="btn btn-c" id="btnCheck">✔ Kiểm tra đáp án</button>
    <div class="fb" id="feedback"></div>
    <div class="nav">
      <button class="btn btn-g" id="btnPrev">← Bài trước</button>
      <button class="btn btn-g" id="btnNext">Bài tiếp →</button>
    </div>
  </div>
</div>

<script>
const CHAPTERS={1:'Chương 1 · Tập hợp và số tự nhiên',2:'Chương 2 · Tính chia hết',3:'Chương 3 · Số nguyên',4:'Chương 4 · Một số hình phẳng trong thực tiễn',5:'Chương 5 · Tính đối xứng của hình phẳng'};
let problems=[], cur=-1;
let done={}; try{done=JSON.parse(localStorage.getItem('toan6_done')||'{}')}catch(e){done={}}

fetch('problems.json').then(r=>r.json()).then(d=>{problems=d;renderHome();});

function renderHome(){
  document.getElementById('totalCount').textContent=problems.length;
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('probArea').classList.add('hidden');
  const h=document.getElementById('home');
  const doneCount=problems.filter(p=>done[p.id]).length;
  let html=`<p id="progress">Đã làm đúng: <b>${doneCount}/${problems.length}</b> bài</p>`;
  Object.keys(CHAPTERS).forEach(cn=>{
    const list=problems.map((p,i)=>({...p,_i:i})).filter(p=>p.chapter==cn);
    if(!list.length)return;
    html+=`<div class="chap"><h2>${CHAPTERS[cn]}</h2>`;
    list.forEach(p=>{
      html+=`<button class="p-item" onclick="openProb(${p._i})"><span>${p.title} <small style="color:#888">(${p.topic})</small></span><span class="${done[p.id]?'done':'todo'}">${done[p.id]?'✅':'○'}</span></button>`;
    });
    html+='</div>';
  });
  h.innerHTML=html;
}

function openProb(i){
  cur=i;
  const p=problems[i];
  document.getElementById('home').classList.add('hidden');
  document.getElementById('probArea').classList.remove('hidden');
  document.getElementById('pTopic').textContent=CHAPTERS[p.chapter]+' — '+p.topic;
  document.getElementById('pTitle').textContent=p.title;
  document.getElementById('pText').textContent=p.text;
  document.getElementById('pFig').innerHTML=p.svg||'';
  document.getElementById('anaPanel').innerHTML=
    `<h3>🔍 Phân tích đề</h3>`+
    `<div><span class="lbl">Đề cho biết:</span><br>• ${p.analysis.given.join('<br>• ')}</div>`+
    `<div style="margin-top:6px"><span class="lbl">Đề hỏi:</span> ${p.analysis.ask}</div>`+
    `<div style="margin-top:6px"><span class="lbl">Hướng làm:</span> ${p.analysis.plan}</div>`;
  document.getElementById('hintPanel').innerHTML=`<h3>💡 Gợi ý</h3>${p.hint}`;
  document.getElementById('solPanel').innerHTML=`<h3>📖 Lời giải chi tiết</h3><ol>${p.solution.map(s=>`<li>${s}</li>`).join('')}</ol>`;
  ['anaPanel','hintPanel','solPanel'].forEach(id=>document.getElementById(id).classList.remove('show'));
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='fb';
  document.getElementById('ansArea').innerHTML=p.parts.map((pt,j)=>
    `<div class="ans-row"><label>${pt.label}:</label><input id="inp${j}" inputmode="decimal" placeholder="Nhập đáp án"><span class="unit">${pt.unit||''}</span></div>`
  ).join('');
  document.getElementById('btnPrev').disabled=(i===0);
  document.getElementById('btnNext').disabled=(i===problems.length-1);
  window.scrollTo(0,0);
}

function parseNum(s){
  if(s==null)return NaN;
  s=(''+s).trim().replace(/\s+/g,'');
  if(!s)return NaN;
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  if(s.includes('/')){
    const[a,b]=s.split('/');
    const x=parseNum(a), y=parseNum(b);
    return (isNaN(x)||isNaN(y)||y===0)?NaN:x/y;
  }
  return parseFloat(s.replace(',','.'));
}

function check(){
  const p=problems[cur];
  let allOk=true;
  p.parts.forEach((pt,j)=>{
    const inp=document.getElementById('inp'+j);
    const v=parseNum(inp.value), want=parseNum(pt.answer);
    const ok=!isNaN(v)&&Math.abs(v-want)<0.001;
    inp.classList.toggle('ok',ok);
    inp.classList.toggle('no',!ok);
    if(!ok)allOk=false;
  });
  const fb=document.getElementById('feedback');
  if(allOk){
    fb.textContent='🎉 Đúng rồi! Làm tốt lắm. Nhớ xem lại phần Phân tích và Lời giải để hiểu sâu hơn nhé.';
    fb.className='fb ok';
    done[p.id]=true;
    try{localStorage.setItem('toan6_done',JSON.stringify(done))}catch(e){}
  }else{
    fb.textContent='❌ Chưa đúng hết. Xem lại phần 🔍 Phân tích đề hoặc 💡 Gợi ý rồi thử lại nhé!';
    fb.className='fb no';
  }
}

document.getElementById('btnAna').onclick=()=>document.getElementById('anaPanel').classList.toggle('show');
document.getElementById('btnHint').onclick=()=>document.getElementById('hintPanel').classList.toggle('show');
document.getElementById('btnSol').onclick=()=>document.getElementById('solPanel').classList.toggle('show');
document.getElementById('btnCheck').onclick=check;
document.getElementById('btnList').onclick=renderHome;
document.getElementById('btnPrev').onclick=()=>{if(cur>0)openProb(cur-1)};
document.getElementById('btnNext').onclick=()=>{if(cur<problems.length-1)openProb(cur+1)};
</script>
</body>
</html>
